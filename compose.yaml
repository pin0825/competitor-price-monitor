services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: price_monitor
      POSTGRES_USER: price_monitor
      POSTGRES_PASSWORD: price_monitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_monitor -d price_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://price_monitor:price_monitor@db:5432/price_monitor
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
