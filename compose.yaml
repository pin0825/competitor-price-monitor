services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: price_monitor
      POSTGRES_USER: price_monitor
      POSTGRES_PASSWORD: price_monitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_monitor -d price_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://price_monitor:price_monitor@db:5432/price_monitor
      COLLECTION_API_KEY: local-scheduler-key
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    build:
      context: .
    command: ["python", "-m", "app.scheduler"]
    environment:
      COLLECTION_API_KEY: local-scheduler-key
      SCHEDULER_API_URL: http://api:8000
      COLLECTION_INTERVAL_SECONDS: 21600
      SCHEDULER_RUN_ON_STARTUP: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
