name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: price_monitor
          POSTGRES_PASSWORD: price_monitor
          POSTGRES_DB: price_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_monitor -d price_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://price_monitor:price_monitor@localhost:5432/price_monitor

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # 실제 PostgreSQL을 대상으로 마이그레이션이 처음부터 적용되는지 검사한다.
      - name: Run database migrations
        run: python -m alembic upgrade head

      # ORM 모델 변경 후 마이그레이션 파일을 빠뜨린 경우 CI에서 실패시킨다.
      - name: Check migration consistency
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check .
